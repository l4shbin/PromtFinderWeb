            background-color: #000; 
        }
        .app-view {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #app-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% + 90px); 
            border: none;
            display: none;
            background: #fff;
        }
        .ui-shield {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: transparent;
            z-index: 10000;
            pointer-events: none;
        }
    </style>
